<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Isha Nikam Portfolio</title>
<meta name="description" content="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap">
<style>
/* Layout: a near-empty white stage; a small pill nav floats top-centre and the work fills the screen edge to edge */
:root {
  --bg: #ffffff;
  --ink: #0b0b0b;
  --muted: #8b8b8b;
  --soft: #f1f1f1;
  --chip: #e7e7e7;
  --line: #e4e4e4;
  /* The reference uses Teodor (serif) and Lay Grotesk (sans), both paid fonts.
     Drop licensed files into /fonts (see @font-face below) and they are used automatically;
     until then Newsreader and Inter Tight stand in. */
  --sans: "Lay Grotesk", "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif: "Teodor", "Newsreader", "Times New Roman", Georgia, serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}

/* Exact reference fonts: after licensing them, put the .woff2 files in /fonts and remove the comment markers.
@font-face { font-family: "Teodor"; src: url("../fonts/Teodor-Light.woff2") format("woff2"); font-weight: 300; font-display: swap; }
@font-face { font-family: "Teodor"; src: url("../fonts/Teodor-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lay Grotesk"; src: url("../fonts/LayGrotesk-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Lay Grotesk"; src: url("../fonts/LayGrotesk-Medium.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
*/

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: clip;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); }

@keyframes rise { from { transform: translateY(26px); opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }

/* ---------- Loader ---------- */
.loader {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: grid; place-items: center;
  transition: opacity .9s var(--ease), visibility .9s;
}
.loader.is-done { opacity: 0; visibility: hidden; }
/* Opening: the name flashes in; an invisible hand writes "'s" after it and "portfolio" below it;
   then the name folds to "IN", the handwriting turns into "Portfolio" beside it, and both fly into the header */
.loader.is-moving { background: transparent; pointer-events: none; transition: background .9s var(--ease); }
.loader.is-moving.is-done { transition: opacity .35s, visibility .35s; }
.loader.is-moving .loader-count { opacity: 0; transition: opacity .5s var(--ease); }
.intro { display: flex; flex-direction: column; align-items: center; font-size: clamp(30px, 7.4vw, 128px); line-height: 1.05; white-space: nowrap; transform-origin: 0 0; will-change: transform; }
.intro-row { position: relative; display: flex; align-items: baseline; }
.intro-name { display: inline-flex; align-items: baseline; font-family: var(--sans); font-weight: 600; letter-spacing: -.04em; opacity: 0; filter: blur(12px); transform: scale(1.06); transition: opacity .7s var(--ease), filter .9s var(--ease), transform 1.1s var(--ease); }
.intro.s1 .intro-name { opacity: 1; filter: none; transform: none; }
.intro .c { display: inline-block; max-width: 5em; overflow: hidden; vertical-align: bottom; transition: max-width 1s var(--ease), opacity .6s var(--ease); }
.intro .sp { width: .26em; }
.intro.s3 .c { max-width: 0; opacity: 0; }
/* "'s" and "portfolio": crisp type revealed letter by letter, from soft blur and wide tracking to sharp */
.hw { display: inline-flex; align-items: baseline; font-family: var(--sans); font-weight: 300; letter-spacing: -.035em; white-space: nowrap; transition: opacity .6s var(--ease), filter .6s var(--ease), transform 1s var(--ease); }
.hw .ch { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(.18em) scale(1.12); transition: opacity .7s cubic-bezier(.2, .7, .2, 1), filter 1s cubic-bezier(.2, .7, .2, 1), transform 1.2s cubic-bezier(.16, 1, .3, 1); transition-delay: calc(var(--ci) * var(--st, 55ms)); }
.hw .ch.sp2 { width: .25em; }
.hw.on .ch { opacity: 1; filter: blur(0); transform: none; }
.hw.track { letter-spacing: .14em; transition: letter-spacing 1.6s cubic-bezier(.16, 1, .3, 1), opacity .6s var(--ease), filter .6s var(--ease), transform 1s var(--ease); }
.hw.track.on { letter-spacing: var(--ls, -.035em); }
.hw-s { width: 0; overflow: visible; }   /* zero width: hangs off the end of the name, so the name stays centred */
.hw-s-in { display: inline-flex; align-items: baseline; padding-left: .01em; }
.intro-row2 { max-height: 2em; transition: max-height 1s var(--ease), margin 1s var(--ease); line-height: 1; }
/* compile */
.intro-serif { display: inline-block; font-family: var(--serif); font-weight: 400; letter-spacing: -.03em; max-width: 0; margin-left: 0; opacity: 0; overflow: hidden; transform: translateY(55%); transition: max-width 1s var(--ease), margin 1s var(--ease), opacity .7s var(--ease) .25s, transform 1s var(--ease) .15s; }
.intro.s3 .hw-s { opacity: 0; filter: blur(6px); }
.intro.s3 .hw-p { opacity: 0; filter: blur(8px); transform: translateY(-60%); }
.intro.s3 .intro-row2 { max-height: 0 !important; margin-top: 0 !important; }
.intro.s3 .intro-serif { max-width: 6em; margin-left: .26em; opacity: 1; transform: none; }
.intro.fly { transition: transform 1.15s cubic-bezier(.7, 0, .2, 1); }
body.intro-on .logo { opacity: 0; }
.logo { transition: opacity .35s; }
.loader-inner { display: grid; justify-items: center; gap: 12px; }
.loader-mark { font-weight: 600; font-size: 13px; letter-spacing: -.03em; }
.loader-bar { display: none; width: 120px; height: 1px; background: var(--line); position: relative; overflow: hidden; }
.loader-bar i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(0); }
.loader-count { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-family: var(--serif); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Header / nav ---------- */
.nav-wrap {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: var(--gl); padding-right: var(--gr);
  display: flex; justify-content: center;
  pointer-events: none;
}
.nav { pointer-events: auto; display: flex; align-items: center; gap: 4px; }
.logo { display: inline-flex; align-items: baseline; gap: .26em; font-size: 14px; line-height: 1.05; padding: 3px 12px 3px 0; white-space: nowrap; }
.logo-in { font-weight: 600; letter-spacing: -.045em; }
.logo-word { font-family: var(--serif); font-weight: 400; letter-spacing: -.03em; }
.tab {
  display: inline-flex; align-items: flex-start;
  height: 22px; padding: 0 6px;
  background: var(--soft); border-radius: 3px;
  transition: background .3s;
}
.tab:hover { background: var(--chip); }
.tab-label {
  font-family: var(--serif); font-size: 14.5px; line-height: 22px;
  max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0;
  transition: max-width .7s var(--ease), opacity .4s, margin .7s var(--ease);
}
.tab sup { font-size: 9px; font-weight: 600; line-height: 1; margin-top: 4px; }
.tab.is-active .tab-label { max-width: 170px; opacity: 1; margin: 0 3px 0 4px; }

.dot-btn {
  position: fixed; z-index: 51;
  top: calc(10px + env(safe-area-inset-top, 0px));
  right: var(--gr);
  width: 22px; height: 22px; border-radius: 3px;
  background: var(--soft);
  display: grid; place-items: center;
  pointer-events: auto;
}
.dot-btn span { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); transition: transform .5s var(--ease); }
.dot-btn[aria-expanded="true"] span { transform: scale(2.3); }

/* ---------- Menu panel ---------- */
.menu {
  position: fixed; z-index: 52;
  top: calc(40px + env(safe-area-inset-top, 0px));
  right: var(--gr);
  width: min(320px, calc(100vw - 32px));
  background: var(--soft); border-radius: 4px;
  padding: 18px;
  display: grid; gap: 22px;
  transform-origin: top right;
  animation: pop .45s var(--ease) both;
}
.menu-name { font-family: var(--serif); font-size: 24px; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
.menu-role { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.menu-links { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-family: var(--serif); font-size: 17px; }
.menu-links a:hover, .info a:hover { color: var(--muted); }
.mail-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.mail-row span { user-select: all; }
.copy-btn { font-size: 11px; font-weight: 500; background: var(--chip); border-radius: 3px; padding: 2px 6px; }

/* ---------- Views ---------- */
.view { display: none; }
.view.is-active { display: block; }
.view.is-active .enter { animation: rise 1.1s var(--ease) both; animation-delay: var(--d, 0s); }
.page { position: relative; z-index: 2; overflow-x: clip; }
.view[data-view="about"] { overflow: clip; }

.veil {
  position: fixed; inset: 0; z-index: 70;
  background: var(--bg); opacity: 0; pointer-events: none;
  transition: opacity .42s var(--ease);
}
.veil.is-on { opacity: 1; pointer-events: auto; }

/* Screen change: the current screen drifts up and fades, the next one rises in — no blank flash */
.view.page { transition: opacity .3s var(--ease), transform .3s var(--ease); }
.view-space { transition: opacity .3s var(--ease); }
body.v-out .view.is-active { opacity: 0; }
body.v-out .view.page.is-active { transform: translateY(-16px); }
body.v-out .space-canvas, body.v-out .blob-canvas, body.v-out .space-guide { opacity: 0 !important; transition: opacity .3s var(--ease); }
.space-guide { transition: opacity .45s var(--ease); }
.view.v-in { opacity: 0; transition: none !important; }
.view.page.v-in { transform: translateY(26px); }
.view.v-rise { transition: opacity .7s var(--ease), transform .9s var(--ease) !important; }

/* ---------- 1. Creative Space ---------- */
.view-space { height: 100vh; height: 100dvh; position: relative; z-index: 2; pointer-events: none; }
.space-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1;
  touch-action: none; cursor: grab;
  opacity: 0; pointer-events: none; transition: opacity .6s;
}
body[data-view="space"] .space-canvas { opacity: 1; pointer-events: auto; }
.space-canvas.is-hovering { cursor: pointer; }
.space-canvas.is-dragging { cursor: grabbing; }
.space-corner {
  position: fixed; z-index: 2; margin: 0;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted);
}
.space-corner.left, .space-corner.right { display: none; }
.space-corner.center { left: 50%; transform: translateX(-50%); font-family: var(--serif); font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }

.hover-label {
  position: fixed; left: 0; top: 0; z-index: 60;
  pointer-events: none;
  display: grid; gap: 1px;
  background: var(--bg); border-radius: 3px; padding: 5px 8px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .07);
  font-size: 12px; white-space: nowrap;
  opacity: 0; transition: opacity .25s;
}
.hover-label.is-on { opacity: 1; }
.hover-label b { font-weight: 500; letter-spacing: -.02em; }
.hover-label span { font-family: var(--serif); color: var(--muted); font-size: 13px; }
.hover-label p { margin: 4px 0 0; max-width: 260px; white-space: normal; font-family: var(--serif); font-size: 14px; line-height: 1.3; color: var(--ink); }
.hover-label em { margin-top: 6px; font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------- 2. Projects ---------- */
.p-head { padding: clamp(120px, 24vh, 210px) var(--gr) clamp(60px, 10vh, 96px) var(--gl); text-align: center; }
.mixed { margin: 0; font-weight: 500; font-size: clamp(17px, 1.45vw, 22px); letter-spacing: -.04em; text-wrap: balance; }
.mixed .serif { font-weight: 400; letter-spacing: -.01em; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px 8px; padding: 0 8px; }
.card { display: block; min-width: 0; }
.card-media { position: relative; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; background: var(--soft); }
.card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s var(--ease); }
.chip {
  position: absolute; top: 8px; left: 8px;
  background: rgba(236, 236, 236, .88); backdrop-filter: blur(6px);
  padding: 3px 6px; border-radius: 3px;
  font-size: 11px; font-weight: 500; letter-spacing: -.01em;
}
.card-meta { padding: 10px 2px 0; display: grid; gap: 1px; }
.card-title { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: -.025em; }
.card-cats { margin: 0; font-family: var(--serif); font-size: 14px; color: var(--ink); }
.card-over { display: none; margin: 6px 0 0; max-width: 46ch; font-family: var(--serif); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.3; letter-spacing: -.01em; color: var(--ink); text-wrap: pretty; }

.reveal .card-media { clip-path: inset(9% 0 0 0); transition: clip-path 1.3s var(--ease); }
.reveal .card-media img { transform: scale(1.14); }
.reveal .card-meta { transform: translateY(14px); transition: transform 1.1s var(--ease) .1s; }
.reveal.in .card-media { clip-path: inset(0); }
.reveal.in .card-media img { transform: scale(1); }
.reveal.in .card-meta { transform: none; }
.reveal.in:hover .card-media img { transform: scale(1.045); }

.foot {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 140px var(--gr) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gl);
  font-size: 12px; color: var(--muted);
}
.foot a:hover { color: var(--ink); }

/* ---------- Case study ---------- */
.work-head { padding: clamp(120px, 22vh, 190px) var(--gr) 44px var(--gl); display: grid; justify-items: center; gap: 16px; text-align: center; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.work-title { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(46px, 8.5vw, 136px); line-height: .95; letter-spacing: -.035em; text-wrap: balance; }
.work-hero { margin: 0 8px; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: var(--soft); }
.work-hero img { width: 100%; height: 100%; object-fit: cover; }
.work-info { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px 16px; padding: 90px var(--gr) 90px var(--gl); }
.work-meta { grid-column: 1 / 5; margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; font-size: 12px; align-content: start; }
.work-meta dt { color: var(--muted); }
.work-meta dd { margin: 0; font-weight: 500; }
.work-desc { grid-column: 6 / 12; margin: 0; font-family: var(--serif); font-size: clamp(20px, 2vw, 30px); line-height: 1.28; letter-spacing: -.015em; text-wrap: pretty; }
.work-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px; }
.work-gallery figure { margin: 0; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; background: var(--soft); }
.work-gallery figure.wide { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.work-gallery img { width: 100%; height: 100%; object-fit: cover; }
.work-next { display: grid; justify-items: center; gap: 10px; padding: 150px var(--gr) 40px var(--gl); text-align: center; }
.work-next .eyebrow { color: var(--ink); }
.work-next .serif { font-weight: 300; font-size: clamp(42px, 7.5vw, 116px); line-height: .95; letter-spacing: -.035em; transition: letter-spacing .8s var(--ease), color .3s; }
.work-next:hover .serif { letter-spacing: -.015em; color: var(--muted); }

/* ---------- Case study (projects with "sections") ---------- */
#work { --pband: #111; --pink: #fff; --pa: #111; }
[data-anim] { opacity: 0; transform: translateY(28px); transition: opacity 1s var(--ease), transform 1.1s var(--ease); transition-delay: calc(var(--i, 0) * 90ms); }
[data-anim].in { opacity: 1; transform: none; }

.cs-progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 55; pointer-events: none; }
.cs-progress i { display: block; height: 100%; background: var(--pa); transform-origin: left; transform: scaleX(0); }

.cs-head { padding: clamp(120px, 21vh, 180px) var(--gr) 44px var(--gl); display: grid; justify-items: center; gap: 18px; text-align: center; }
.cs-over { margin: 0; max-width: 30ch; font-family: var(--serif); font-size: clamp(20px, 2.1vw, 30px); line-height: 1.22; letter-spacing: -.02em; color: var(--muted); text-wrap: balance; }
.cs-links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.cs-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 500; letter-spacing: -.01em;
  transition: background .3s, color .3s, border-color .3s, transform .4s var(--ease);
}
.cs-btn:hover { border-color: var(--ink); transform: translateY(-2px); }
.cs-btn.is-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cs-btn.is-primary:hover { background: var(--pa); border-color: var(--pa); }

.cs-hero { position: relative; margin: 0 8px; padding: clamp(28px, 6vw, 96px) clamp(16px, 6vw, 110px) 0; background: var(--pband); border-radius: 4px; overflow: hidden; isolation: isolate; }
.cs-hero-orb { position: absolute; z-index: -1; width: 60%; aspect-ratio: 1; right: -12%; top: -30%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--pa) 55%, transparent), transparent 65%); filter: blur(30px); animation: orb 14s ease-in-out infinite alternate; }
@keyframes orb { to { transform: translate(-18%, 22%) scale(1.15); } }
.cs-hero-frame { max-width: 1180px; margin: 0 auto; background: #fff; border-radius: 10px 10px 0 0; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .45); transform-origin: 50% 0; will-change: transform; }
.cs-hero-frame img { width: 100%; }
.fig-bar { display: flex; gap: 6px; padding: 9px 12px; background: #f3f3f2; border-bottom: 1px solid #e7e7e5; }
.fig-bar i { width: 9px; height: 9px; border-radius: 50%; background: #d8d8d5; }

.cs-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 0 var(--gr) 40px var(--gl); }
.cs-stat { display: grid; gap: 10px; align-content: start; padding-top: 18px; border-top: 1px solid var(--ink); min-width: 0; }
.cs-stat b { font-family: var(--serif); font-weight: 300; font-size: clamp(40px, 5vw, 76px); line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--pa); }
.cs-stat-bar { height: 2px; background: var(--pa); transform-origin: left; transform: scaleX(0); transition: transform 1.4s var(--ease) .2s; }
.cs-stat.in .cs-stat-bar { transform: scaleX(.35); }
.cs-stat p { margin: 0; font-size: 13px; color: var(--muted); max-width: 26ch; }

.cs-sec { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 16px; padding: clamp(80px, 12vw, 150px) var(--gr) 0 var(--gl); }
.cs-sec-head { grid-column: 1 / 4; display: flex; gap: 10px; align-items: baseline; font-size: 12px; font-weight: 500; align-self: start; position: sticky; top: 64px; }
.cs-num { font-family: var(--serif); font-size: 15px; color: var(--pa); font-variant-numeric: tabular-nums; }
.cs-sec-body { grid-column: 4 / 12; display: grid; gap: 18px; min-width: 0; }
.cs-h { margin: 0 0 6px; max-width: 20ch; font-family: var(--serif); font-weight: 300; font-size: clamp(32px, 4vw, 60px); line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
.cs-sec-body > p { margin: 0; max-width: 62ch; font-family: var(--serif); font-size: clamp(17px, 1.35vw, 20px); line-height: 1.5; color: #2a2a2a; text-wrap: pretty; }

.cs-steps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; position: relative; }
.cs-steps::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: var(--line); }
.cs-steps::after { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 1px; background: var(--pa); transform-origin: left; transform: scaleX(0); transition: transform 1.8s var(--ease) .2s; }
.cs-steps.in::after { transform: scaleX(1); }
.cs-steps li { position: relative; display: grid; gap: 8px; align-content: start; padding-top: 34px; opacity: 0; transform: translateY(16px); transition: opacity .8s var(--ease), transform .9s var(--ease); transition-delay: calc(.3s + var(--i) * .25s); }
.cs-steps.in li { opacity: 1; transform: none; }
.cs-steps li::before { content: ""; position: absolute; top: 7px; left: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--pa); }
.cs-step-no { font-size: 11px; font-weight: 600; color: var(--pa); }
.cs-steps h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.cs-steps p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }

.cs-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.cs-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); font-family: var(--serif); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.4; }
.cs-list li::before { content: "✓"; font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--pa); padding-top: 3px; }

.cs-cards { grid-column: 4 / 13; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 40px; }
.cs-card { display: grid; gap: 8px; align-content: start; padding: 20px; background: var(--soft); border-radius: 4px; min-width: 0; transition: background .4s, transform .5s var(--ease); }
.cs-card:hover { background: color-mix(in srgb, var(--pa) 9%, var(--soft)); transform: translateY(-3px); }
.cs-card-meta { font-size: 11px; font-weight: 600; color: var(--pa); }
.cs-card h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.cs-card p { margin: 0; font-family: var(--serif); font-size: 15px; line-height: 1.4; color: #3a3a3a; }

.fig { grid-column: 1 / -1; margin: clamp(40px, 6vw, 72px) 0 0; display: grid; gap: 10px; }
.fig-stage { background: color-mix(in srgb, var(--pband) 12%, #f3f3f1); border-radius: 4px; padding: clamp(16px, 5vw, 80px); display: grid; place-items: center; overflow: hidden; }
.fig-media { width: 100%; max-width: 980px; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 30px 70px -34px rgba(0, 0, 0, .4); }
.fig-wide .fig-media { max-width: 1240px; }
.fig-narrow .fig-media { max-width: 420px; }
.fig-img { overflow: hidden; }
.fig-img img { width: 100%; transition: transform .2s linear; }
.fig figcaption { font-size: 12px; color: var(--muted); padding-left: 2px; }
.fig[data-anim] { transform: translateY(50px) scale(.98); }
.fig[data-anim].in { transform: none; }

.cs-quote { margin: clamp(100px, 14vw, 180px) auto 0; padding: 0 var(--gr) 0 var(--gl); max-width: 1100px; text-align: center; }
.cs-quote p { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(28px, 3.6vw, 54px); line-height: 1.12; letter-spacing: -.03em; text-wrap: balance; }
.cs-quote p::before { content: "“"; display: block; font-size: 2em; line-height: .6; color: var(--pa); }

.cs-cta { margin: clamp(90px, 12vw, 160px) 8px 0; background: var(--pband); color: var(--pink); border-radius: 4px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; padding: clamp(32px, 6vw, 90px) clamp(16px, 5vw, 80px); overflow: hidden; }
.cs-cta-copy { display: grid; gap: 16px; justify-items: start; }
.cs-cta-eyebrow { margin: 0; font-size: 12px; font-weight: 500; opacity: .7; }
.cs-cta h2 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(32px, 4vw, 60px); line-height: 1; letter-spacing: -.035em; text-wrap: balance; }
.cs-cta-copy > p { margin: 0; max-width: 44ch; font-family: var(--serif); font-size: 17px; line-height: 1.45; opacity: .85; }
.cs-cta .cs-links { justify-content: flex-start; }
.cs-cta .cs-btn { border-color: color-mix(in srgb, var(--pink) 35%, transparent); color: var(--pink); }
.cs-cta .cs-btn.is-primary { background: var(--pink); color: var(--pband); border-color: var(--pink); }
.cs-cta .cs-btn.is-primary:hover { background: var(--pink); opacity: .88; }
.cs-cta-shot { display: block; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .55); transform: rotate(-1.5deg); transition: transform .8s var(--ease); }
.cs-cta-shot:hover { transform: rotate(0) scale(1.02); }
.cs-cta-shot img { width: 100%; }
.work-next-over { max-width: 40ch; font-family: var(--serif); font-size: 17px; color: var(--muted); }

/* ---------- 3. About ---------- */
.on-bunny { cursor: pointer; }
.ripple { position: fixed; left: var(--x); top: var(--y); z-index: 4; width: 0; height: 0; border-radius: 50%; border: 1px solid rgba(11, 11, 11, .35); pointer-events: none; transform: translate(-50%, -50%); animation: ripple 1.6s cubic-bezier(.25, 1, .5, 1) both; }
@keyframes ripple { 0% { width: 0; height: 0; opacity: 1; } 100% { width: var(--d); height: var(--d); opacity: 0; } }
.on-ear { cursor: grab; }
.dragging-ear, .dragging-ear * { cursor: grabbing !important; user-select: none; }
.blob-canvas {
  position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3;
  pointer-events: none; opacity: 0; transition: opacity .7s;
}
body[data-view="about"] .blob-canvas { opacity: 1; }

/* Statement measured from the reference at 1440×900: ~80px type, ~87px leading,
   a ~900px centred block of three lines, centred in the viewport, small sans line ~60px below */
.about-hero {
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-content: center; justify-items: center; gap: clamp(34px, 4.2vw, 62px);
  padding: 80px var(--gr) 60px var(--gl); text-align: center;
}
.statement {
  margin: 0; max-width: 24em;
  font-family: var(--serif); font-weight: 400; font-variation-settings: "opsz" 72;
  font-size: clamp(26px, 4vw, 70px); line-height: 1.09; letter-spacing: -.028em;
  text-wrap: balance;
}
.statement sup { font-family: var(--sans); font-size: .2em; font-weight: 500; vertical-align: top; position: relative; top: .55em; margin: 0 .55em 0 .2em; letter-spacing: 0; }
.currently { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: -.01em; }

.skills { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 150px; gap: 0 16px; padding: 40px var(--gr) 40px var(--gl); }
.skill { display: grid; gap: 22px; align-content: start; min-width: 0; }
.skill h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
.skill ul { list-style: none; margin: 0; padding: 0; font-family: var(--serif); font-size: clamp(15px, 1.15vw, 18px); line-height: 1.38; }
/* zigzag: Research (left), Product Design (right), Strategy (left), Tools (right) */
.skill:nth-child(odd) { grid-column: 2 / 6; text-align: right; }
.skill:nth-child(even) { grid-column: 8 / 12; text-align: left; }
/* even staircase: each section starts the same distance below the previous one */
.skill:nth-child(1) { grid-row: 1 / span 2; }
.skill:nth-child(2) { grid-row: 2 / span 2; }
.skill:nth-child(3) { grid-row: 3 / span 2; }
.skill:nth-child(4) { grid-row: 4 / span 1; }


.chapter { padding: 64px var(--gr) 24px var(--gl); display: grid; gap: clamp(36px, 5vw, 64px); }
.ch-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 28px; font-size: 12px; font-weight: 500; }
.ch-head span:first-child { justify-self: end; }
.ch-num { font-family: var(--serif); font-weight: 300; font-size: clamp(52px, 6vw, 88px); line-height: 1; min-width: 1.4em; text-align: center; }
.ch-tagline { margin: calc(clamp(36px, 5vw, 64px) * -.55) 0 0; text-align: center; font-family: var(--serif); font-size: clamp(18px, 1.7vw, 24px); letter-spacing: -.01em; color: var(--muted); text-wrap: balance; }
.ch-body { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; font-family: var(--serif); font-size: clamp(16px, 1.3vw, 20px); line-height: 1.45; }
.ch-body p { margin: 0; text-wrap: pretty; }
[data-scrub], [data-scrub] li, [data-scrub] h3 { will-change: transform, opacity; }
/* same columns as the skills blocks: left column 2-5 (right-aligned), right column 8-11 (left-aligned) */
.ch-body p:first-child { grid-column: 2 / 6; text-align: right; }
.ch-body p:last-child { grid-column: 8 / 12; text-align: left; margin-top: clamp(28px, 4vw, 64px); }

.info { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 48px 16px; padding: 72px var(--gr) 40px var(--gl); }
.info-block { display: grid; gap: 20px; align-content: start; min-width: 0; }
.info-block:first-child { grid-column: 4 / 7; }
.info-block:last-child { grid-column: 8 / 12; }
.info h3 { margin: 0; font-size: 12px; font-weight: 600; }
.info h3.info-sub { margin-top: 20px; }
.info .exp span { display: block; font-family: var(--sans); font-size: 12px; color: var(--muted); margin-top: 2px; }
.info ul { list-style: none; margin: 0; padding: 0; font-family: var(--serif); font-size: clamp(15px, 1.15vw, 18px); line-height: 1.4; }
.info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; font-size: 13px; }
.info dt { color: var(--muted); font-size: 12px; }
.info dd { margin: 0; font-family: var(--serif); font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Lightbox ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(255, 255, 255, .95); backdrop-filter: blur(10px);
  display: grid; place-items: center;
  padding: 70px var(--gr) 40px var(--gl);
  animation: rise .6s var(--ease) both;
}
.lb-inner { margin: 0; display: grid; gap: 12px; justify-items: center; max-width: min(560px, 100%); }
.lb-inner img { max-height: 72vh; width: auto; background: var(--soft); }
.lb-inner figcaption { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.lb-inner figcaption b { font-weight: 500; letter-spacing: -.02em; }
.lb-inner figcaption span { font-family: var(--serif); color: var(--muted); font-size: 14px; }
.lb-close {
  position: fixed; top: calc(44px + env(safe-area-inset-top, 0px)); right: var(--gr);
  background: var(--soft); border-radius: 3px; padding: 3px 8px; font-size: 12px; font-weight: 500;
}

/* ---------- Small screens ---------- */
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; gap: 40px; }
  .work-hero { aspect-ratio: 4 / 5; }
  .work-meta, .work-desc { grid-column: 1 / -1; }
  .work-gallery { grid-template-columns: 1fr; }
  .work-gallery figure.wide { aspect-ratio: 4 / 5; }
  .skills { gap: 80px 16px; grid-auto-rows: auto; }
  .skill:nth-child(n) { grid-row: auto; }
  .skill:nth-child(n) { grid-column: 1 / -1; margin-top: 0; text-align: right; }
  .skill:nth-child(2n) { text-align: left; }
  .ch-head { gap: 14px; }
  .ch-body p:first-child, .ch-body p:last-child { grid-column: 1 / -1; }
  .ch-body p:last-child { margin-top: 24px; }
  .info-block:first-child, .info-block:last-child { grid-column: 1 / -1; }
  .space-corner.right { display: none; }
  .cs-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; }
  .cs-sec-head { grid-column: 1 / -1; position: static; margin-bottom: 18px; }
  .cs-sec-body, .cs-cards { grid-column: 1 / -1; }
  .cs-steps { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .cs-steps::before, .cs-steps::after { left: 5px; right: auto; top: 0; bottom: 0; width: 1px; height: auto; }
  .cs-steps::after { transform: scaleY(0); transform-origin: top; }
  .cs-steps.in::after { transform: scaleY(1); }
  .cs-steps li { padding: 0 0 26px 30px; }
  .cs-steps li::before { top: 2px; }
  .cs-cards { grid-template-columns: minmax(0, 1fr); }
  .cs-cta { grid-template-columns: minmax(0, 1fr); }
  .cs-hero { padding-top: 24px; }
}
@media (min-width: 761px) and (max-width: 1100px) {
  .cs-cards { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cs-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px; }
}

/* About motion: masked word rise, staggered skill lists, numeral roll-in */
.view[data-view="about"] [data-anim] { transform: translate3d(var(--sx, 0px), var(--sy, 36px), 0); transition: opacity 1.1s var(--ease), transform 1.4s var(--ease); transition-delay: calc(var(--i, 0) * 90ms); }
.view[data-view="about"] [data-anim].in { transform: none; }
.statement .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.statement .w > span { display: inline-block; transform: translateY(110%); }
.statement .w sup { margin-right: .05em; }
.view.is-active .statement .w > span { animation: wordUp 1.3s var(--ease) both; animation-delay: calc(.2s + var(--wi) * .055s); }
@keyframes wordUp { from { transform: translateY(110%) rotate(4deg); } to { transform: none; } }
.view.is-active .currently.enter { animation-delay: 1s; }
.ch-head .ch-num { display: inline-block; transform: translateY(40%) scale(.8); opacity: 0; transition: transform 1.4s var(--ease) .15s, opacity 1s var(--ease) .15s; }
.ch-head.in .ch-num { transform: none; opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}


/* ---------- In-portfolio viewer: case studies and prototypes open here, with a back button ---------- */
.viewer { position: fixed; inset: 0; z-index: 90; display: grid; grid-template-rows: auto 1fr; background: #fff; opacity: 0; transform: translateY(24px); transition: opacity .5s var(--ease), transform .7s var(--ease); }
.viewer.on { opacity: 1; transform: none; }
.v-bar { display: flex; align-items: center; gap: 14px; padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gr) 10px var(--gl); border-bottom: 1px solid rgba(0,0,0,.08); background: rgba(255,255,255,.96); backdrop-filter: blur(10px); font-size: 13px; }
.v-back { display: inline-flex; align-items: center; gap: 8px; border: 0; background: #111; color: #fff; border-radius: 999px; padding: 8px 16px 8px 12px; font: 500 13px var(--sans); cursor: pointer; transition: transform .5s var(--ease), background .3s; }
.v-back:hover { transform: translateX(-3px); background: #333; }
.v-back svg { width: 16px; height: 16px; }
.v-title { font-weight: 500; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-title span { color: var(--muted); font-weight: 400; margin-left: 8px; }
.v-ext { margin-left: auto; color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 12px; }
.v-ext:hover { color: #111; }
.v-frame { position: relative; min-height: 0; background: #f4f4f4; }
.v-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.v-load { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .4s; }
.v-fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #f4f4f4; }
.v-fallback > div { max-width: 520px; display: grid; gap: 16px; justify-items: center; text-align: center; }
.v-fallback img { width: 100%; border-radius: 10px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.4); }
.v-fallback p { margin: 0; font-family: var(--serif); font-size: 18px; line-height: 1.35; }
.v-fallback a { background: #111; color: #fff; text-decoration: none; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 500; }
@media (max-width: 760px) { .v-title span { display: none; } .v-ext { font-size: 11px; } }
/* ---------- Clear navigation (HR-friendly) ---------- */
.nav-wrap { align-items: center; gap: 10px; }
.logo { pointer-events: auto; position: fixed; left: var(--gl); top: calc(10px + env(safe-area-inset-top, 0px)); height: 44px; align-items: center; padding: 0; font-size: 15px; }
.dot-btn { top: calc(15px + env(safe-area-inset-top, 0px)) !important; }
.nav { position: relative; isolation: isolate; background: #fff; border: 1px solid var(--chip); border-radius: 999px; padding: 4px; gap: 2px; box-shadow: 0 8px 28px -14px rgba(0,0,0,.25); }
.tab { position: relative; z-index: 1; height: 34px; padding: 0 16px 0 6px; align-items: center; gap: 8px; background: transparent; border-radius: 999px; color: var(--ink); transition: color .35s var(--ease) .12s; }
.tab:hover { background: transparent; }
.tab:not(.is-active):hover .tab-label { opacity: .55; }
.tab-label { max-width: none; opacity: 1; margin: 0; font-family: var(--serif); font-size: 15.5px; font-weight: 400; letter-spacing: -.015em; line-height: 34px; transition: opacity .25s; }
.tab sup { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; margin: 0; padding: 0; border-radius: 50%; border: 1px solid currentColor; font-family: var(--sans); font-style: normal; font-size: 10.5px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; vertical-align: middle; top: 0; padding-top: 1px; box-sizing: border-box; transition: background .35s var(--ease) .12s, color .35s var(--ease) .12s, border-color .35s var(--ease) .12s; }
.tab.is-active { background: transparent; color: #fff; }
.tab.is-active .tab-label { max-width: none; margin: 0; }
.tab.is-active sup { background: #fff; border-color: #fff; color: var(--ink); }

/* From Uiverse.io by Bodyhc - https://uiverse.io/Bodyhc/light-lion-39
   MIT License, Copyright (c) Bodyhc (Abdullah Soliman)
   Adapted: the liquid "liquid-3" switch becomes the sliding indicator behind the three tabs. */
.nav-goo {
  --primary: var(--ink);
  --secondary: #fff;
  --time: .6s;
  position: absolute; inset: 0; z-index: 0;
  border-radius: 999px; overflow: hidden; pointer-events: none;
  background: var(--secondary);
  filter: blur(3px) contrast(30);
}
.nav-goo i {
  position: absolute; top: 4px; bottom: 4px; left: 0;
  border-radius: 999px; background: var(--primary);
  width: var(--gw, 0px); transform: translateX(var(--gx, 0px));
}
.nav-goo .goo-b { width: var(--gh, 34px); transform: translateX(var(--gc, 0px)); }
.nav-goo.is-ready .goo-a { transition: transform var(--time) cubic-bezier(.75, 0, .75, 1.3), width var(--time) cubic-bezier(.75, 0, .75, 1.3); }
.nav-goo.is-ready .goo-b { transition: transform calc(var(--time) * 1.25) cubic-bezier(.75, 0, .75, 1); }
.tab-x { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; margin-left: 4px; border-radius: 999px; background: #fff4c9; font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .3s; }
.tab-x:hover { background: #ffe88a; }
.tab-x i { font-style: normal; display: inline-block; transition: transform .3s var(--ease); }
.tab-x:hover i { transform: rotate(45deg); }
.dot-btn { width: auto; height: 34px; padding: 0 14px 0 12px; gap: 8px; display: inline-flex; align-items: center; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--ink); color: #fff; }
.dot-btn span { background: #8ef0a6; box-shadow: 0 0 0 3px rgba(142,240,166,.25); }
.dot-btn[aria-expanded="true"] span { transform: scale(1.3); }
.cr-mob { display: none; }
.menu { top: calc(52px + env(safe-area-inset-top, 0px)); }

/* landing guide on the Creative Space */
.space-guide { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; border-radius: 999px; background: rgba(255,255,255,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--chip); box-shadow: 0 10px 30px -14px rgba(0,0,0,.3); pointer-events: auto; white-space: nowrap; font-size: 13px; }
.space-guide p { margin: 0; color: var(--muted); }
.space-guide p b { color: var(--ink); font-weight: 500; }
.space-guide a { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 500; }
.space-guide a:hover { background: #333; }

/* skip the opening */
.skip-intro { position: fixed; z-index: 101; right: var(--gr); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 500; animation: pop .45s var(--ease) .6s both; }
.skip-intro kbd { font: inherit; font-size: 10.5px; opacity: .6; border: 1px solid rgba(255,255,255,.35); border-radius: 4px; padding: 1px 5px; }
.skip-intro:hover { background: #333; }

@media (max-width: 760px) {
  .nav-wrap { justify-content: flex-start; }
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); top: auto; }
  .tab { height: 40px; padding: 0 12px 0 5px; gap: 5px; }
  .tab-label { font-size: 12.5px; line-height: 40px; }
  .tab-x { display: none; }

    const dark = kind === 1 || kind === 4;

    g.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, m = Math.min(w, h);

    if (kind === 0) { // chrome sphere
      const r = m * 0.22;
      const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.05, cx, cy, r);
      gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.35, "#bdbdbd"); gr.addColorStop(0.72, "#262626"); gr.addColorStop(1, "#8f8f8f");
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
    } else if (kind === 1) { // ring and satellite
      g.strokeStyle = "#f2f2f2"; g.lineWidth = m * 0.01;
      g.beginPath(); g.arc(cx, cy, m * 0.2, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#f2f2f2"; g.beginPath();
      g.arc(cx + m * 0.2 * Math.cos(seed), cy + m * 0.2 * Math.sin(seed), m * 0.025, 0, Math.PI * 2); g.fill();
    } else if (kind === 2) { // text column
      g.fillStyle = "#a29d94";

        const lw = m * (0.16 + ((i * 37 + seed * 13) % 10) / 40);
        g.fillRect(cx - m * 0.2, h * 0.28 + i * h * 0.032, lw, Math.max(2, h * 0.006));
      }
    } else if (kind === 3) { // soft spheres
      [[-0.09, 0.05, 0.13], [0.08, -0.04, 0.11], [0.02, 0.11, 0.09]].forEach(([ox, oy, rr]) => {
        const x = cx + ox * m, y = cy + oy * m, r = rr * m;
        const gr = g.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
        gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.6, "#cfcfcf"); gr.addColorStop(1, "#9c9c9c");
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();

    } else if (kind === 4) { // card on dark
      g.save(); g.translate(cx, cy); g.rotate(-0.12 + (seed % 3) * 0.08);
      g.fillStyle = "#e9e9e6"; g.fillRect(-m * 0.22, -m * 0.15, m * 0.44, m * 0.3);
      g.fillStyle = "#b5b5b5"; g.fillRect(-m * 0.16, -m * 0.06, m * 0.2, m * 0.012); g.fillRect(-m * 0.16, -m * 0.02, m * 0.13, m * 0.012);

      g.lineTo(cx - aw / 2, cy - ah / 2 + aw / 2);
      g.arc(cx, cy - ah / 2 + aw / 2, aw / 2, Math.PI, 0);
      g.lineTo(cx + aw / 2, cy + ah / 2);

      g.fillText(label, m * 0.05, h - m * 0.05);

      <a class="work-next" href="${esc(next.caseUrl || `#work-${next.slug}`)}"${/^https?:/.test(next.caseUrl || "") ? ' target="_blank" rel="noopener"' : ""}>
        <span class="eyebrow">Next case study</span>
        <span class="serif">${esc(next.title)}</span>
        <span class="work-next-over">${esc(next.overview || "")}</span>
      </a>
      ${footer}`;
  }

  function renderWork(p) {
    if (p.sections) return renderCaseStudy(p);
    $("#work").removeAttribute("style");
    const i = S.projects.indexOf(p);
    const next = S.projects[(i + 1) % S.projects.length];
    const gal = p.gallery && p.gallery.length ? p.gallery : ["", "", "", "", ""];
    $("#work").innerHTML = `
      <header class="work-head">
        <p class="eyebrow enter">${esc((p.categories || []).join(", "))} · ${esc(p.year)}</p>
        <h1 class="work-title enter" style="--d:.08s">${esc(p.title)}</h1>
      </header>
      <figure class="work-hero enter" style="--d:.16s"><img src="${pic(p.cover, i, p.title, 1600, 900)}" alt="${esc(p.title)}"></figure>
      <div class="work-info">
        <dl class="work-meta">
          ${p.client ? `<dt>Client</dt><dd>${esc(p.client)}</dd>` : ""}
          <dt>Role</dt><dd>${esc(p.role)}</dd>
          <dt>Year</dt><dd>${esc(p.year)}</dd>
          <dt>Tools</dt><dd>${esc(p.tools)}</dd>
        </dl>
        <p class="work-desc">${esc(p.description)}</p>
      </div>
      <div class="work-gallery">
        ${gal.map((src, j) => {
          const wide = j % 3 === 0;
          return `<figure class="${wide ? "wide" : ""}"><img src="${pic(src, i * 7 + j + 1, `${p.title} — image ${j + 1}`, wide ? 1600 : 800, wide ? 900 : 1000)}" alt="${esc(p.title)}, image ${j + 1}" loading="lazy"></figure>`;
        }).join("")}
      </div>
      <a class="work-next" href="${esc(next.caseUrl || `#work-${next.slug}`)}"${/^https?:/.test(next.caseUrl || "") ? ' target="_blank" rel="noopener"' : ""}><span class="eyebrow">Next project</span><span class="serif">${esc(next.title)}</span></a>
      ${footer}`;
  }

  /* ---------------- Scroll-in reveals ---------------- */
  // Numbers like "95.9%", "22–28%" or "1 tap" count up from zero to their first number
  function countUp(el) {
    const raw = el.dataset.count || "";
    const m = raw.match(/^([^\d]*)([\d.]+)(.*)$/);
    if (!m || reduce) return;
    const target = parseFloat(m[2]), dec = (m[2].split(".")[1] || "").length, t0 = performance.now();
    (function step(t) {
      const k = clamp((t - t0) / 1400, 0, 1), e = 1 - Math.pow(1 - k, 3);
      el.textContent = m[1] + (target * e).toFixed(dec) + m[3];
      if (k < 1) requestAnimationFrame(step); else el.textContent = raw;
    })(t0);
  }
  const reveal = (el) => {
    el.classList.add("in");
    $$("[data-count]", el).forEach(countUp);
  };
  const io = "IntersectionObserver" in window
    ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" })
    : null;
  // About page: each block waits until it reaches the bunny's face (middle of the screen), then slides in from its own side
  const faceIO = "IntersectionObserver" in window
    ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { reveal(e.target); faceIO.unobserve(e.target); } }), { rootMargin: "0px 0px -46% 0px" })
    : null;
  const watchReveals = () => $$(".view.is-active .reveal:not(.in), .view.is-active [data-anim]:not(.in)").forEach((el) => {
    if (el.closest('[data-view="about"]') && faceIO) {
      const r = el.getBoundingClientRect(), c = (r.left + r.right) / 2, w = innerWidth;
      const side = c < w * 0.42 ? -1 : c > w * 0.58 ? 1 : 0;
      el.style.setProperty("--sx", `${side * Math.min(140, w * 0.09)}px`);
      el.style.setProperty("--sy", side ? "0px" : "36px");
      return faceIO.observe(el);
    }
    io ? io.observe(el) : reveal(el);
  });

  /* ---------------- Smooth scroll ---------------- */
  const lenis = window.Lenis && !reduce ? new window.Lenis({ lerp: 0.1, smoothWheel: true }) : null;
  const toTop = () => (lenis ? lenis.scrollTo(0, { immediate: true, force: true }) : window.scrollTo(0, 0));

  /* About: a never-ending loop. The page is followed by a copy of itself and cut off one screen into the copy,
     so the bottom looks exactly like the top; scrolling past the end wraps round to the start, and scrolling up
     from the top wraps to the end. */
  const aboutView = $('[data-view="about"]');
  const loopA = document.createElement("div");
  loopA.className = "loop-a";
  while (aboutView.firstChild) loopA.appendChild(aboutView.firstChild);
  const loopB = loopA.cloneNode(true);
  loopB.className = "loop-b";
  loopB.setAttribute("aria-hidden", "true");
  aboutView.append(loopA, loopB);
  let loopH = 0;
  function sizeLoop() {
    if (document.body.dataset.view !== "about") return;
    const h = loopA.offsetHeight;
    if (!h || h === loopH) return;
    loopH = h;
    aboutView.style.height = `${loopH + innerHeight}px`;
    lenis && lenis.resize();
  }
  addEventListener("resize", () => { loopH = 0; sizeLoop(); });
  if ("ResizeObserver" in window) new ResizeObserver(sizeLoop).observe(loopA);
  // without smooth scrolling (reduced motion), wrap with plain scrolling
  addEventListener("scroll", () => {
    if (!lenis && document.body.dataset.view === "about" && loopH && scrollY >= loopH) window.scrollTo(0, scrollY - loopH);
  }, { passive: true });

  /* ---------------- Lightbox ---------------- */
  const lb = $("#lightbox");
  function openLightbox(e, seed) {
    lb.innerHTML = `
      <button class="lb-close" type="button">Close</button>
      <figure class="lb-inner">
        <img src="${pic(e.image, seed, e.title)}" alt="${esc(e.title)}">
        <figcaption><b>${esc(e.title)}</b><span>${esc(e.category)}</span></figcaption>
      </figure>`;
    lb.hidden = false;
    lenis && lenis.stop();
    $(".lb-close", lb).focus();
  }
  function closeLightbox() { lb.hidden = true; lenis && lenis.start(); }
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target.closest(".lb-close")) closeLightbox(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!lb.hidden) closeLightbox(); setMenu(false); } });

  /* ---------------- 1. Creative Space: 3D cloud of cards ---------------- */
  const space = (() => {
    const off = { enter() {}, leave() {}, frame() {} };
    if (!window.THREE) return off;
    const canvas = $("#space-canvas");
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { return off; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    const R = 4.2;

    const list = [
      ...S.projects.map((p, i) => ({ kind: "project", title: p.title, sub: (p.categories || []).join(", "), over: p.overview, src: p.cover, slug: p.slug, url: p.caseUrl, seed: i, main: true })),
      ...S.explorations.map((e, i) => {
        const p = e.project && S.projects.find((x) => x.slug === e.project);
        return p
          ? { kind: "project", title: e.title, sub: e.category, over: p.overview, src: e.image, slug: p.slug, url: p.caseUrl, seed: i + S.projects.length, main: e.main }
          : e.url
            ? { kind: "link", title: e.title, sub: e.category, src: e.image, video: e.video, url: e.url, seed: i + S.projects.length, main: e.main }
            : { kind: "explore", title: e.title, sub: e.category, src: e.image, seed: i + S.projects.length, data: e };
      }),
    ];
    if (!list.length) return off;
    const items = [];
    // each image appears once: no repeats to pad the cloud, and duplicate images are skipped
    const seen = new Set();
    for (const it of list) {
      const key = it.src || `${it.kind}:${it.title}`;
      if (seen.has(key)) continue;
      seen.add(key);
      items.push(it);
    }

    const N = items.length, golden = Math.PI * (3 - Math.sqrt(5));
    const geo = new THREE.PlaneGeometry(1, 1);
    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin("anonymous");
    const cards = items.map((it, i) => {
      const y = 1 - ((i + 0.5) / N) * 2, r = Math.sqrt(1 - y * y), th = i * golden;
      const base = new THREE.Vector3(Math.cos(th) * r, y * 0.92, Math.sin(th) * r);
      const [aw, ah] = ASPECTS[it.seed % ASPECTS.length];
      const size = it.main ? 1.2 : 0.72 + (((i * 7919) % 10) / 10) * 0.35;
      const ph = new THREE.CanvasTexture(drawArt(it.seed, 420, Math.round((420 * ah) / aw), it.title));
      ph.encoding = THREE.sRGBEncoding;
      const mat = new THREE.MeshBasicMaterial({ map: ph, transparent: true, opacity: 0 });
      const mesh = new THREE.Mesh(geo, mat);
      const card = { mesh, base, it, w: size, h: (size * ah) / aw, hover: 0 };
      // keep every card at a similar area, so wide shots don't shrink into strips
      const fit = (a) => { const area = size * size * 1.15; card.w = Math.min(Math.sqrt(area / a), size * 1.9); card.h = card.w * a; };
      if (it.video) {
        // a silent looping clip plays on the card itself
        const vEl = document.createElement("video");
        Object.assign(vEl, { src: it.video, muted: true, loop: true, playsInline: true, autoplay: true, preload: "auto" });
        vEl.setAttribute("muted", ""); vEl.setAttribute("playsinline", "");
        vEl.addEventListener("loadeddata", () => {
          const tex = new THREE.VideoTexture(vEl);
          tex.encoding = THREE.sRGBEncoding; tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
          mat.map = tex; mat.needsUpdate = true;
          fit(vEl.videoHeight / vEl.videoWidth);
        }, { once: true });
        vEl.play().catch(() => {});
        card.video = vEl;
      } else if (it.src) {
        loader.load(it.src, (tex) => {
          tex.encoding = THREE.sRGBEncoding;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();  // keep thumbnails sharp at an angle
          tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = true;
          mat.map = tex; mat.needsUpdate = true;
          // keep every card at a similar area, so wide shots don't shrink into strips
          const a = tex.image.height / tex.image.width;
          const area = size * size * 1.15;
          card.w = Math.min(Math.sqrt(area / a), size * 1.9);
          card.h = card.w * a;
        });
      }
      mesh.userData.card = card;
      scene.add(mesh);
      return card;
    });
    const meshes = cards.map((c) => c.mesh);

    let active = false, introStart = 0;
    let rotY = 0, rotX = 0.18, velY = 0, velX = 0, dim = 0;
    let drag = null, hovered = null;
    const mouse = new THREE.Vector2(-9, -9), cam = { x: 0, y: 0 };
    const ray = new THREE.Raycaster(), euler = new THREE.Euler(), q = new THREE.Quaternion(), v = new THREE.Vector3();
    const label = $("#hover-label");

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camera.position.z = (R * 1.15) / (t * Math.min(1, camera.aspect * 1.3));
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);

    function setMouse(e) {
      mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      label.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 16}px)`;
    }
    function pick() {
      if (drag && drag.moved > 6) return;
      ray.setFromCamera(mouse, camera);
      const hit = ray.intersectObjects(meshes)[0];
      const next = hit ? hit.object.userData.card : null;
      if (next !== hovered) {
        hovered = next;
        canvas.classList.toggle("is-hovering", !!hovered);
        if (hovered) {
          const it = hovered.it;
          label.innerHTML = `<b>${esc(it.title)}</b><span>${esc(it.sub)}</span>` +
            (it.over ? `<p>${esc(it.over)}</p>` : "") +
            (it.kind === "link" ? `<em>${it.video ? "Watch video" : "Open prototype"} →</em>` : it.kind === "project" ? `<em>View case study →</em>` : "");
        }
        label.classList.toggle("is-on", !!hovered);
      }
    }
    function open(it) {
      if (it.url) { if (it.url[0] === "#") location.hash = it.url.slice(1); else window.open(it.url, "_blank", "noopener"); }
      else if (it.kind === "project") location.hash = `work-${it.slug}`;
      else openLightbox(it.data, it.seed);
    }

    canvas.addEventListener("pointerdown", (e) => {
      setMouse(e);
      drag = { x: e.clientX, y: e.clientY, moved: 0 };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add("is-dragging");
    });
    canvas.addEventListener("pointermove", (e) => {
      setMouse(e);
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      velY = dx * 0.0035; velX = dy * 0.0025;
      rotY += velY; rotX += velX;
    });
    const endDrag = (e) => {
      const click = drag && drag.moved < 6;
      drag = null;
      canvas.classList.remove("is-dragging");
      if (click) { setMouse(e); pick(); if (hovered) open(hovered.it); }
      if (e.pointerType !== "mouse") { mouse.set(-9, -9); }
    };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", () => { drag = null; canvas.classList.remove("is-dragging"); });
    canvas.addEventListener("pointerleave", () => mouse.set(-9, -9));
    addEventListener("wheel", (e) => {
      if (!active) return;
      velY = clamp(velY + clamp(e.deltaY, -120, 120) * 0.00008, -0.06, 0.06);
    }, { passive: true });

    function frame(t) {
      if (!active) return;
      const k = reduce ? 1 : clamp((t - introStart) / 2000, 0, 1);
      const intro = 1 - Math.pow(1 - k, 4);
      if (!drag) {
        velY *= 0.95; velX *= 0.9;
        rotY += velY + (reduce ? 0.0004 : 0.0016);
        rotX += velX + (0.18 - rotX) * 0.02;
      }
      rotX = clamp(rotX, -0.7, 0.7);

      const mx = mouse.x < -2 ? 0 : mouse.x, my = mouse.y < -2 ? 0 : mouse.y;
      cam.x += (mx * 0.5 - cam.x) * 0.04; cam.y += (my * 0.35 - cam.y) * 0.04;
      camera.position.x = cam.x; camera.position.y = cam.y;
      camera.lookAt(0, 0, 0);

      pick();
      dim += ((hovered ? 1 : 0) - dim) * 0.12;
      euler.set(rotX, rotY + (1 - intro) * 2.6, 0);
      q.setFromEuler(euler);
      const rad = R * (0.25 + 0.75 * intro);
      for (const c of cards) {
        v.copy(c.base).applyQuaternion(q).multiplyScalar(rad);
        c.mesh.position.copy(v);
        c.mesh.quaternion.copy(camera.quaternion);
        c.hover += ((c === hovered ? 1 : 0) - c.hover) * 0.15;
        const s = (0.6 + 0.4 * intro) * (1 + c.hover * 0.14);
        c.mesh.scale.set(c.w * s, c.h * s, 1);
        c.mesh.material.opacity = intro * (c === hovered ? 1 : 1 - dim * 0.28);
      }
      renderer.render(scene, camera);
    }

    return {
      enter() { active = true; introStart = performance.now(); rotY = 0; velY = 0; resize(); },
      leave() { active = false; hovered = null; label.classList.remove("is-on"); },
      frame,
    };
  })();

  /* ---------------- 3. About: chrome bunny ---------------- */
  // A chrome bunny pinned in the middle of the page. It pops in on a spring, turns to look at the cursor,
  // spins as you scroll, floats, blinks, and its ears swing behind the head's movement.
  const blob = (() => {
    const off = { enter() {}, leave() {}, frame() {} };
    if (!window.THREE) return off;
    const canvas = $("#blob-canvas");
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { return off; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
    camera.position.z = 7;

    // Studio room rendered into an environment map: bright softboxes and dark bands give crisp chrome reflections
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x6e6e6e, side: THREE.BackSide })));
    const panel = (w, h, rgb, p, r) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...rgb), side: THREE.DoubleSide }));
      m.position.set(...p); m.rotation.set(...r); env.add(m);
    };
    panel(10, 2.2, [0.03, 0.03, 0.03], [0, -0.6, -4.9], [0, 0, 0]);   // dark horizon behind
    panel(10, 0.5, [0.03, 0.03, 0.03], [0, 2.2, -4.9], [0, 0, 0]);
    panel(10, 1.6, [0.05, 0.05, 0.05], [0, 1.9, 4.9], [0, Math.PI, 0]); // dark band in front (the "floor line")
    panel(1.1, 10, [0.04, 0.04, 0.04], [-4.9, 0, -1.5], [0, Math.PI / 2, 0]);
    panel(1.1, 10, [0.04, 0.04, 0.04], [4.9, 0, 1.5], [0, -Math.PI / 2, 0]);
    panel(7, 2, [5, 5, 5], [0, 4.9, 0], [Math.PI / 2, 0, 0]);           // top softbox
    panel(1.2, 6, [3.5, 3.5, 3.5], [-4.9, 0.5, 1.5], [0, Math.PI / 2, 0]);
    panel(2.4, 3, [2.6, 2.7, 3], [4.9, 0.8, -1.5], [0, -Math.PI / 2, 0]);
    panel(0.6, 4, [5, 5, 5], [2.2, 0.4, 4.9], [0, Math.PI, 0]);
    panel(8, 3, [2.4, 2.4, 2.4], [0, -4.9, 0], [-Math.PI / 2, 0, 0]);    // white floor bounce
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envMap = pmrem.fromScene(env, 0.02).texture;

    const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.04, envMap, envMapIntensity: 1.5 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0xcfe0ff, metalness: 1, roughness: 0.06, envMap, envMapIntensity: 1.35 });

    const bunny = new THREE.Group();   // turns, spins and floats
    const body = new THREE.Group();    // squash and stretch
    bunny.add(body);

    // head: a slightly wide, soft sphere
    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), chrome);
    head.scale.set(1.04, 0.96, 0.98);
    body.add(head);

    // ears: long rounded ovals on pivots at their base, so they can swing
    const ears = [-1, 1].map((side) => {
      const pivot = new THREE.Group();
      pivot.position.set(side * 0.36, 0.72, -0.05);
      const ear = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), chrome);
      ear.scale.set(0.34, 0.76, 0.3);
      ear.position.y = 0.62;
      pivot.add(ear);
      pivot.userData = { side, rest: side * -0.12, z: side * -0.12, vz: 0, x: 0, vx: 0, s: 1, vs: 0, hover: false, flopAt: -1e9 };
      body.add(pivot);
      return pivot;
    });

    // eyes: small glossy lenses set low on the face, slightly sunk into the head
    const onFace = (x, y, r) => new THREE.Vector3(x, y, 1).normalize().multiplyScalar(r);
    const eyes = [-1, 1].map((side) => {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.17, 48, 48), eyeMat);
      e.scale.set(1, 1.08, 0.62);
      e.position.copy(onFace(side * 0.4, -0.28, 0.95));
      e.lookAt(e.position.clone().multiplyScalar(2));
      body.add(e);
      return e;
    });
    bunny.position.y = -0.3;
    scene.add(bunny);

    // Tap the bunny to switch between chrome and metallic black (tap again to switch back)
    const SILVER = new THREE.Color(0xffffff), BLACK = new THREE.Color(0x030304);
    const hitMeshes = [head, ...ears.map((p) => p.children[0]), ...eyes];
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    let dark = false, tint = 0, tapAt = -1e9, pendingFlip = false;
    // what is under the pointer: an ear (its pivot), the head/eyes (true), or nothing (null)
    const pickAt = (e) => {
      ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(hitMeshes, false)[0];
      if (!hit) return null;
      return ears.find((p) => p.children[0] === hit.object) || true;
    };
    const overBunny = (e) => !!pickAt(e);

    /* Ears you can play with:
       - hover an ear: it perks up and stretches a little
       - the ears lean towards the cursor
       - tap an ear: it flops forward and springs back with a wobble
       - drag an ear: bend it around; let go and it springs back */
    let drag = null;
    addEventListener("pointerdown", (e) => {
      if (!active || e.button > 0 || e.target.closest("a, button, .menu")) return;
      const hit = pickAt(e);
      if (hit && hit !== true) {
        drag = { ear: hit, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: 0 };
        document.body.classList.add("dragging-ear");
        e.preventDefault();
      }
    });
    addEventListener("pointermove", (e) => {
      if (!active) return;
      if (drag) {
        drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
        drag.moved = Math.max(drag.moved, Math.hypot(drag.dx, drag.dy));
        return;
      }
      const hit = pickAt(e);
      ears.forEach((p) => (p.userData.hover = hit === p));
      document.body.classList.toggle("on-bunny", hit === true);
      document.body.classList.toggle("on-ear", !!hit && hit !== true);
    });
    const endDrag = () => {
      if (!drag) return;
      const u = drag.ear.userData;
      if (drag.moved < 6) { u.flopAt = performance.now(); u.vx += 4; }  // a tap: flop
      else { u.vz += -drag.dx * 0.03; u.vx += drag.dy * 0.03; }         // a fling: wobble on release
      drag = null;
      document.body.classList.remove("dragging-ear");
      suppressClick = true; setTimeout(() => (suppressClick = false), 0);
    };
    let suppressClick = false;
    addEventListener("selectstart", (e) => { if (drag) e.preventDefault(); });
    addEventListener("pointerup", endDrag);
    addEventListener("pointercancel", endDrag);

  skipBtn.addEventListener("click", skipIntro);
  loaderEl.addEventListener("pointerdown", skipIntro);
  loaderEl.style.cursor = "pointer";
  (async () => {
    document.body.classList.add("intro-on");
    if (!reduce) { document.body.appendChild(skipBtn); addEventListener("keydown", onKey); skipBtn.focus({ preventScroll: true }); }
    if (reduce) {
      loaderEl.classList.add("is-done");
      document.body.classList.remove("intro-on");
      onRoute();
      requestAnimationFrame(loop);
      return;
    }
    await fitWords();
    await nextFrame();
    // 001 to 100 at the bottom of the screen, finishing as the title flies into the header
    const countEl = $("#loader-count"), c0 = performance.now(), cDur = 5600;
    (function tick(t) {
      const k = Math.min(1, (t - c0) / cDur), e = 1 - Math.pow(1 - k, 2.2);
      countEl.textContent = String(1 + Math.round(e * 99)).padStart(3, "0");
      if (k < 1) requestAnimationFrame(tick);
    })(c0);
    introEl.classList.add("s1");                       // name flashes in
    await wait(1000);
    if (skipped) return;
    await revealWord($(".hw-s", introEl), 520);            // 's
    if (skipped) return;
    await revealWord($(".hw-p", introEl), 1900);           // portfolio
    await wait(300);
    if (skipped) return;
    introEl.classList.add("s3");                       // compile into "IN Portfolio"
    route1();                                          // build the page under the cover so the header settles first
    await wait(1200);
    if (skipped) return;
    skipBtn.remove(); removeEventListener("keydown", onKey);
    // fly: line the big "IN" up with the small "IN" in the header logo
    const a = introEl.getBoundingClientRect();
    const n = $(".intro-name", introEl).getBoundingClientRect(), m = $(".logo-in", logoEl).getBoundingClientRect();
    const sc = m.height / n.height;
    const tx = m.left - a.left - (n.left - a.left) * sc, ty = m.top - a.top - (n.top - a.top) * sc;
    introEl.classList.add("fly");
    loaderEl.classList.add("is-moving");
    await nextFrame();
    introEl.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
    await wait(1200);
    document.body.classList.remove("intro-on");
    loaderEl.classList.add("is-done");
  })();
})();

</script>

<style>.rz{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:rgba(18,18,18,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;font-family:inherit}
.rz.on{opacity:1;visibility:visible}
.rz-bar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff}
.rz-bar h2{margin:0 auto 0 4px;font-size:15px;font-weight:500;letter-spacing:-.01em}
.rz-bar h2 small{opacity:.6;font-weight:400;margin-left:6px}
.rz-b{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:0;font:500 13.5px/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}

.rz-x{background:rgba(255,255,255,.14);color:#fff;width:38px;padding:0;justify-content:center;font-size:18px}

.rz-page{position:relative;max-width:860px;margin:0 auto}.rz-hot{position:absolute;display:block;border-radius:999px;cursor:pointer}.rz-hot:hover{box-shadow:0 0 0 2px rgba(255,255,255,.55)}.rz-hot:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rz-body img{display:block;width:100%;max-width:860px;height:auto;margin:0 auto;border-radius:4px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);background:#fff}
.rz-dl{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:.82em;font-weight:500;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
@media (max-width:560px){.rz-bar h2 small{display:none}.rz-dlb span{display:none}}
</style>
<script>/* Résumé viewer: opens the PDF inside the portfolio, with download inside and next to every résumé link */
(() => {
  const PDF = "Isha_Nikam_Resume.pdf", IMG = "resume-page.jpg", NAME = "Isha_Nikam_Resume.pdf";
  const isRz = (a) => a && a.tagName === "A" && !a.hasAttribute("download") && (a.getAttribute("href") || "").endsWith(PDF);
  let box, last;
  function build() {
    box = document.createElement("div");
    box.className = "rz"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-label", "Résumé");
    box.innerHTML = `<div class="rz-bar"><h2>Résumé <small>Isha Nikam · UX/UI Designer</small></h2>
      <a class="rz-b rz-dlb" href="${PDF}" download="${NAME}">↓ <span>Download</span> PDF</a>
      <button type="button" class="rz-b rz-x" aria-label="Close résumé">×</button></div>
      <div class="rz-body" data-lenis-prevent tabindex="0"><div class="rz-page"><img src="${IMG}" alt="Résumé of Isha Nikam, UX/UI Designer" width="2380" height="3368"><a class="rz-hot" href="https://d25m000049-maker.github.io/Ishaportfolio/" target="_blank" rel="noopener" aria-label="Isha's Portfolio" style="left:6.681%;top:24.587%;width:16.177%;height:2.851%"></a><a class="rz-hot" href="https://www.linkedin.com/in/isha-nikam-35b87740a" target="_blank" rel="noopener" aria-label="LinkedIn profile" style="left:65.929%;top:33.317%;width:16.766%;height:1.425%;border-radius:3px"></a></div></div>`;
    document.body.appendChild(box);
    box.querySelector(".rz-x").addEventListener("click", close);
    box.addEventListener("click", (e) => { if (e.target === box || e.target.classList.contains("rz-body")) close(); });
  }
  function open() {
    if (!box) build();
    last = document.activeElement;
    box.querySelector(".rz-body").scrollTop = 0;
    box.classList.add("on");
    box.addEventListener("wheel", (e) => e.stopPropagation(), { passive: true });
    document.documentElement.style.overflow = "hidden";
    setTimeout(() => box.querySelector(".rz-dlb").focus({ preventScroll: true }), 50);
  }
  function close() {
    if (!box || !box.classList.contains("on")) return;
    box.classList.remove("on");
    document.documentElement.style.overflow = "";
    last && last.focus && last.focus({ preventScroll: true });
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a");
    if (!isRz(a) || e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); e.stopPropagation(); open();
  }, true);
  // inside claude.ai the page cannot download directly: hand the PDF over through the downloads capability
  let dlNs = null;
  try { if (window.claude && claude.use) claude.use("downloads").then((n) => { dlNs = n; }, () => {}); } catch {}
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a[download]");
    if (!a || !(a.getAttribute("href") || "").endsWith(PDF) || !(window.claude && claude.use)) return;
    e.preventDefault(); e.stopPropagation();
    const fallback = () => window.open(PDF, "_blank", "noopener");
    if (!dlNs) { fallback(); return; }
    fetch(PDF).then((r) => r.blob()).then((blob) => dlNs.save({ filename: NAME, data: blob }))
      .catch((err) => { if (!err || (err.code !== "declined" && err.code !== "rate_limited")) fallback(); });
  }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && box && box.classList.contains("on")) { e.stopImmediatePropagation(); close(); }
  }, true);
  // a download link right beside every résumé link
  function addDl(root) {
    (root.querySelectorAll ? root.querySelectorAll(`a[href$="${PDF}"]:not([download])`) : []).forEach((a) => {
      if (a.closest(".rz") || (a.nextElementSibling && a.nextElementSibling.dataset.rzdl)) return;
      const d = document.createElement("a");
      d.href = PDF; d.setAttribute("download", NAME); d.dataset.rzdl = "1";
      d.className = a.classList.contains("btn") ? "btn" : "rz-dl";
      const row = a.parentElement && a.parentElement.classList.contains("ct-links");
      if (row) d.className = "rz-row";
      d.innerHTML = row ? `Résumé · download PDF <span aria-hidden="true">↓</span>` : "Download ↓";
      d.setAttribute("aria-label", "Download résumé as PDF");
      a.after(d);
    });
  }
  addDl(document);
  new MutationObserver((ms) => ms.forEach((m) => m.addedNodes.forEach((n) => n.nodeType === 1 && addDl(n.parentNode || n)))).observe(document.body, { childList: true, subtree: true });
})();
</script>
